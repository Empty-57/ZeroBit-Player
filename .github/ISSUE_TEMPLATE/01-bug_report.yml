name: Bug 反馈
description: 反馈崩溃、播放异常、歌词错误或其他影响正常使用的问题
title: "[BUG] "
labels: [bug]

body:
  - type: markdown
    attributes:
      value: |
        请先阅读 [Issue 提交规范](https://github.com/Empty-57/ZeroBit-Player/blob/master/.github/CONTRIBUTING.md#issue-提交规范)，并搜索已有的 Issue。
        标题请保留 `[BUG]` 前缀，简要说明触发条件和现象，例如：`[BUG] 切换音频输出设备后播放停止`。
        一份反馈只描述一个问题；不确定的信息可以注明“不确定”。

  - type: checkboxes
    id: prerequisites
    attributes:
      label: 提交前确认
      options:
        - label: 我已阅读 Issue 提交规范，并搜索了已有的 Issue，未找到相同问题；如有相关问题，会在下方关联。
          required: true

  - type: input
    id: version
    attributes:
      label: 软件版本
      description: 在“设置 → 关于”查看完整版本号；自行构建请同时提供 commit SHA 和构建模式。
      placeholder: "例如：1.8.0 正式版 / 1.8.0（源码构建，commit abc1234，Release）"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 请填写 Windows 版本和系统内部版本号（可运行 winver 查看）。音频问题请补充音频格式、输出设备与 WASAPI 独占模式状态；界面问题请补充显示缩放比例。
      placeholder: |
        系统：Windows 11 24H2，内部版本号 26100.x
        音频格式 / 输出设备 / 独占模式（音频问题）：
        显示缩放比例（界面问题）：
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 描述问题发生的场景、影响范围和出现频率；如果旧版本正常，请注明最后一个正常的版本。
      placeholder: "例如：每次播放 FLAC 后切换输出设备，进度继续走动但没有声音；重启后恢复。"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从启动软件开始，按顺序描述操作和必要设置；偶发问题请注明发生频率与已尝试的操作。
      placeholder: |
        1. 启动软件，打开……
        2. 在……中设置……
        3. 点击……，出现……
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: 预期行为
      description: 完成上述操作后，你期望软件如何表现？
      placeholder: "例如：切换输出设备后，当前歌曲应继续正常播放。"
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: 实际结果
      description: 说明实际发生了什么；如有报错，请提供完整报错文字。可以拖入截图或录屏。
      placeholder: "例如：进度条仍然前进，但新设备没有声音；暂停后再播放也无法恢复。"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志与复现材料（选填）
      description: 日志通常位于 Windows“文档”目录下的 zerobit_logs，仅记录警告及以上级别，可能没有本次问题的记录。请附上问题发生时间及相关日志；歌词、标签或格式问题可提供最小复现片段。上传前请遮盖用户名、私人路径等信息，仅分享有权公开的材料。
      placeholder: |
        问题发生时间：
        相关日志（粘贴时请使用 Markdown 代码块，或上传日志文件）：
        歌词 / 标签 / 音频格式等复现材料：
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: 补充信息（选填）
      description: 关联 Issue、临时解决办法、已尝试的排查方法，或其他能帮助定位的信息。
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: 参与修复（选填）
      options:
        - label: 我愿意提交 PR 修复此问题。
